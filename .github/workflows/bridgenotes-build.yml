name: Build BridgeNotes APK

on:
  push:
    branches:
      - bridgenotes-build-20260924

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: bridgenotes
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp bridgenotes/app/build/outputs/apk/debug/app-debug.apk BridgeNotes-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BridgeNotes-Android
          path: BridgeNotes-1.0.apk
          if-no-files-found: error
