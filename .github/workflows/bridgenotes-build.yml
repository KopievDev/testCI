name: Build BridgeNotes APK

on:
  push:
    branches:
      - bridgenotes-build-20260924

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: bridgenotes
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        run: cp bridgenotes/app/build/outputs/apk/debug/app-debug.apk BridgeNotes-1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BridgeNotes-Android
          path: BridgeNotes-1.0.apk
          if-no-files-found: error
