name: Export Android signing tools

on:
  push:
    branches:
      - bridgenotes-tools-20260924

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Package signing tools
        run: |
          mkdir -p signing-tools/lib
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner signing-tools/
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/zipalign signing-tools/
          cp /usr/local/lib/android/sdk/build-tools/35.0.0/lib/apksigner.jar signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools-35
          path: signing-tools
          if-no-files-found: error
