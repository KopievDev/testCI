name: Build BridgeNotes 2.0

on:
  push:
    branches:
      - bridgenotes-v2-build-20260924

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        working-directory: bridgenotes
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp bridgenotes/app/build/outputs/apk/debug/app-debug.apk BridgeNotes-2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeNotes-Android-2.0
          path: BridgeNotes-2.0.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS app
        working-directory: macos
        run: chmod +x build-app.sh && ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeNotes-macOS-2.0
          path: macos/BridgeNotes-macOS.zip
          if-no-files-found: error
