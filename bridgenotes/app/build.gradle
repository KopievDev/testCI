plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kopiev.bridgenotes'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.kopiev.bridgenotes'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
